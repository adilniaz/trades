services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports: ["12401:5432"]
    environment:
      POSTGRES_USER: trades
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: trades
    volumes: [trades_pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trades"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: ${BUILD_TARGET:-runner}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trades:${POSTGRES_PASSWORD:?}@db:5432/trades
      AUTH_SECRET: ${AUTH_SECRET:?}
      AUTH_URL: ${AUTH_URL:?}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
    depends_on:
      db:
        condition: service_healthy
    ports: ["12400:3000"]
    networks: [default, caddy_net]
    develop:
      watch:
        - action: sync
          path: src
          target: /app/src
        - action: sync
          path: prisma
          target: /app/prisma
        - action: sync
          path: public
          target: /app/public
        - action: rebuild
          path: package.json

volumes:
  trades_pg_data:

networks:
  caddy_net:
    external: true
